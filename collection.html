    <p class="desc">게임에서 직접 만든 조합이 이곳에 차곡차곡 쌓여요. 잠긴 카드는 보드에서 직접 조합해 잠금을 풀어보세요.</p>

<script>
const ART=["H","O","C","N","Na","Cl","Cu","Zn"];
const ELEMENTS=[
  {id:"H",formula:"H",name:"수소",state:"가벼운 기초 원소",desc:"물과 여러 화합물의 시작점이 되는 아주 가벼운 원소예요."},
  {id:"O",formula:"O",name:"산소",state:"연소를 돕는 원소",desc:"물, 산화물, 이산화탄소처럼 많은 반응에 등장해요."},
  {id:"C",formula:"C",name:"탄소",state:"생명의 중심 원소",desc:"산소와 만나 이산화탄소를 만들 수 있어요."},
  {id:"N",formula:"N",name:"질소",state:"공기 속 주요 원소",desc:"수소와 만나 암모니아를 만드는 조합에 쓰여요."},
  {id:"Na",formula:"Na",name:"나트륨",state:"활발한 금속 원소",desc:"염소와 만나 염화나트륨을 만들어요."},
  {id:"Cl",formula:"Cl",name:"염소",state:"황록색 비금속 원소",desc:"나트륨·구리·마그네슘·아연과 염화물을 만들고, 수소와는 염화수소를 만들어요."},
  {id:"Cu",formula:"Cu",name:"구리",state:"붉은빛 금속 원소",desc:"산소와 결합하거나 치환 반응에 참여해요."},
  {id:"Ag",formula:"Ag",name:"은",state:"밝은 금속 원소",desc:"질산은 반응과 산화은 분해에서 발견할 수 있어요."},
  {id:"Zn",formula:"Zn",name:"아연",state:"치환 반응 금속",desc:"염산과 만나 염화아연과 수소를 만들어요."},
  {id:"Mg",formula:"Mg",name:"마그네슘",state:"반응성 금속",desc:"질산이나 염화구리와의 치환 반응에 등장해요."}
];
const COMPOUNDS=[
