<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Part 3 · 분해 반응</title><style>
  :root {
    --bg: #fafafa;
    --surface: #ffffff;
    --surface-soft: #f4f4f5;
    --surface-dark: #18181b;
    --surface-dark-soft: #27272a;
    --border: #e8e8eb;
    --border-strong: #d4d4d8;
    --ink: #0a0a0a;
    --ink-soft: #3f3f46;
    --muted: #71717a;
    --muted-dark: #a1a1aa;
    --success: #16a34a;
    --danger: #dc2626;
    --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.04);
    --shadow: 0 4px 14px rgba(0, 0, 0, 0.05);
    --shadow-lg: 0 18px 44px rgba(0, 0, 0, 0.08);
    --radius-sm: 12px;
    --radius: 18px;
    --radius-lg: 26px;

    --el-H-bg:  linear-gradient(150deg, #f4fbff 0%, #b9e8ff 100%);
    --el-H-fg:  #0d73bd;
    --el-O-bg:  linear-gradient(150deg, #ff8a7f 0%, #e0231e 100%);
    --el-O-fg:  #ffffff;
    --el-C-bg:  linear-gradient(150deg, #5a626a 0%, #1a1d20 100%);
    --el-C-fg:  #ffffff;
    --el-N-bg:  linear-gradient(150deg, #c7adff 0%, #6a3fd0 100%);
    --el-N-fg:  #ffffff;
    --el-Na-bg: linear-gradient(150deg, #b285f6 0%, #7445cf 100%);
    --el-Na-fg: #ffffff;
    --el-Cl-bg: linear-gradient(150deg, #b1f254 0%, #54a818 100%);
    --el-Cl-fg: #ffffff;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    min-height: 100%;
    color: var(--ink);
    background: var(--bg);
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo",
                 "Pretendard", "Malgun Gothic", system-ui, "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }

  button { font: inherit; cursor: pointer; border: 0; color: inherit; }

  button:focus-visible,
  .tile:focus-visible {
    outline: 3px solid rgba(24, 24, 27, 0.32);
    outline-offset: 3px;
  }

  /* ──────────────  Top nav  ────────────── */
  .nav {
    max-width: 1280px;
    margin: 0 auto;
    padding: 18px clamp(16px, 3vw, 32px);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    flex-wrap: wrap;
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 12px;
    font-weight: 800;
    font-size: 15px;
    letter-spacing: -0.01em;
  }
  .brand-mark {
    width: 36px;
    height: 36px;
    border-radius: 10px;
    background: var(--surface-dark);
    color: #fff;
    display: grid;
    place-items: center;
    font-size: 18px;
  }
  .brand small {
    display: block;
    font-size: 11px;
    font-weight: 500;
    color: var(--muted);
    letter-spacing: 0.04em;
    text-transform: uppercase;
    margin-top: 1px;
  }
  .nav-actions {
    display: flex;
    gap: 8px;
    align-items: center;
  }
  .nav-btn {
    height: 38px;
    padding: 0 14px;
    border-radius: 99px;
    font-size: 13px;
    font-weight: 600;
    background: var(--surface);
    color: var(--ink);
    border: 1px solid var(--border-strong);
    display: inline-flex;
    align-items: center;
    gap: 6px;
    transition: background 0.15s ease, border-color 0.15s ease;
  }
  .nav-btn:hover {
    background: #fff;
    border-color: var(--ink-soft);
  }
  .nav-btn-dark {
    background: var(--surface-dark);
    color: #fff;
    border-color: var(--surface-dark);
  }
  .nav-btn-dark:hover {
    background: #000;
    border-color: #000;
  }

  /* ──────────────  Mode bar  ────────────── */
  .mode-bar {
    max-width: 1280px;
    margin: 0 auto 16px;
    padding: 0 clamp(16px, 3vw, 32px);
    display: flex;
    gap: 16px;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
  }
  .mode-pills {
    display: inline-flex;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 99px;
    padding: 4px;
  }
  .mode-pill {
    padding: 8px 18px;
    border-radius: 99px;
    font-size: 13px;
    font-weight: 600;
    color: var(--muted);
    background: transparent;
    transition: background 0.15s ease, color 0.15s ease;
  }
  .mode-pill.active {
    background: var(--surface-dark);
    color: #fff;
  }
  .mode-pill:hover:not(.active) {
    color: var(--ink);
  }
  .mode-meta {
    color: var(--muted);
    font-size: 13px;
  }
  .mode-meta strong {
    color: var(--ink);
    font-weight: 700;
  }

  /* ──────────────  Game shell  ────────────── */
  .shell {
    max-width: 1280px;
    margin: 0 auto;
    padding: 0 clamp(16px, 3vw, 32px) clamp(40px, 6vw, 64px);
  }

  /* status bar */
  .status-bar {
    background: var(--surface-dark);
    color: #fff;
    border-radius: var(--radius);
    padding: 16px 20px;
    margin-bottom: 14px;
    display: grid;
    grid-template-columns: 1fr auto auto;
    gap: 16px;
    align-items: center;
    box-shadow: var(--shadow);
  }
  .mission {
    font-weight: 600;
    font-size: 14px;
    line-height: 1.4;
    color: #fff;
    min-width: 0;
  }
  .mission small {
    display: block;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--muted-dark);
    margin-bottom: 4px;
  }
  .status-chip {
    padding: 8px 14px;
    border-radius: 99px;
    background: rgba(255, 255, 255, 0.10);
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.02em;
    color: #fff;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    white-space: nowrap;
  }
  .status-chip-dot {
    width: 6px; height: 6px; border-radius: 99px;
    background: #fff;
  }
  .status-chip-wrong .status-chip-dot { background: #f87171; }

  /* time track */
  .time-track {
    grid-column: 1 / -1;
    height: 6px;
    border-radius: 99px;
    overflow: hidden;
    background: rgba(255, 255, 255, 0.14);
    margin-top: 2px;
    display: none;
  }
  .time-track.visible { display: block; }
  .time-track.danger { animation: shake 0.18s infinite alternate; }
  @keyframes shake {
    from { transform: translateX(-1px); }
    to   { transform: translateX(1px); }
  }
  .time-fill {
    height: 100%;
    width: 100%;
    background: #fff;
    transition: width 0.2s linear, background 0.2s ease;
  }

  /* layout */
  .layout {
    display: grid;
    grid-template-columns: 280px minmax(0, 1fr) 300px;
    gap: 14px;
  }
  .panel {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 20px;
  }
  .panel-title {
    font-size: 11px;
    font-weight: 700;
    color: var(--muted);
    letter-spacing: 0.1em;
    text-transform: uppercase;
    margin: 0 0 12px;
  }

  /* lesson (left) */
  .message {
    background: var(--surface-soft);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 16px;
    line-height: 1.6;
    color: var(--ink);
    font-size: 14px;
    white-space: pre-line;
    min-height: 110px;
  }
  .message.success {
    background: #f0fdf4;
    border-color: #bbf7d0;
    color: #14532d;
  }
  .message.error {
    background: #fef2f2;
    border-color: #fecaca;
    color: #7f1d1d;
  }
  .reaction-info {
    margin-top: 14px;
    padding: 14px 16px;
    background: var(--surface-soft);
    border-radius: var(--radius-sm);
    color: var(--ink-soft);
    font-size: 13px;
    line-height: 1.55;
    white-space: pre-line;
  }
  .reaction-info strong {
    display: block;
    font-size: 11px;
    color: var(--muted);
    letter-spacing: 0.08em;
    text-transform: uppercase;
    margin-bottom: 6px;
    font-weight: 700;
  }

  /* board (center) */
  .board-panel {
    padding: clamp(14px, 2vw, 22px);
    position: relative;
    overflow: hidden;
    min-height: 460px;
    display: flex;
    flex-direction: column;
  }
  .board-head {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 14px;
  }
  .board-legend {
    font-size: 12px;
    color: var(--muted);
  }
  .board {
    display: grid;
    grid-template-columns: repeat(6, minmax(0, 1fr));
    gap: 10px;
    flex: 1;
    align-content: center;
  }

  /* tile */
  .tile {
    position: relative;
    aspect-ratio: 1 / 1;
    min-width: 0;
    border-radius: 22px;
    border: 2px solid transparent;
    color: #fff;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 0;
    user-select: none;
    transition: transform 0.16s ease, box-shadow 0.16s ease, border 0.16s ease, opacity 0.16s ease;
    box-shadow:
      inset 0 8px 14px rgba(255, 255, 255, 0.32),
      inset 0 -10px 16px rgba(0, 0, 0, 0.16),
      0 6px 18px rgba(0, 0, 0, 0.10);
  }
  .tile::before, .tile::after {
    content: "";
    position: absolute;
    width: 5px;
    height: 7px;
    border-radius: 50%;
    background: #0a0a0a;
    top: 30%;
  }
  .tile::before { left: 30%; }
  .tile::after  { right: 30%; }
  .tile .symbol {
    font-weight: 900;
    font-size: clamp(22px, 3vw, 30px);
    line-height: 1;
    letter-spacing: -0.02em;
    margin-top: 14px;
  }
  .tile .name {
    font-size: 10px;
    font-weight: 700;
    opacity: 0.85;
    margin-top: 3px;
    letter-spacing: 0.04em;
  }
  .tile:hover { transform: translateY(-2px); }
  .tile.selected {
    border-color: var(--surface-dark);
    box-shadow:
      0 0 0 3px rgba(24, 24, 27, 0.10),
      inset 0 8px 14px rgba(255, 255, 255, 0.32),
      inset 0 -10px 16px rgba(0, 0, 0, 0.16),
      0 10px 22px rgba(0, 0, 0, 0.16);
  }
  .tile.consumed {
    opacity: 0.28;
    pointer-events: none;
    filter: grayscale(0.5);
  }

  .tile.H  { background: var(--el-H-bg);  color: var(--el-H-fg); }
  .tile.O  { background: var(--el-O-bg);  color: var(--el-O-fg); }
  .tile.C  { background: var(--el-C-bg);  color: var(--el-C-fg); }
  .tile.N  { background: var(--el-N-bg);  color: var(--el-N-fg); }
  .tile.Na { background: var(--el-Na-bg); color: var(--el-Na-fg); border-radius: 16px; }
  .tile.Cl { background: var(--el-Cl-bg); color: var(--el-Cl-fg); }

  /* animation layer */
  .anim-layer {
    pointer-events: none;
    position: absolute;
    inset: 0;
    overflow: hidden;
  }
  .floating-compound {
    position: absolute;
    left: 50%;
    top: 50%;
    min-width: 180px;
    padding: 18px 22px;
    transform: translate(-50%, -50%);
    border-radius: var(--radius-lg);
    color: #fff;
    text-align: center;
    box-shadow: 0 24px 48px rgba(0, 0, 0, 0.22);
    animation-duration: 1.5s;
    animation-fill-mode: forwards;
  }
  .floating-compound strong {
    display: block;
    font-size: 34px;
    font-weight: 900;
    letter-spacing: -0.02em;
    margin-bottom: 4px;
  }
  .floating-compound span {
    display: block;
    font-weight: 700;
    font-size: 13px;
    opacity: 0.95;
  }
  .move-down-flow    { animation-name: downFlow; }
  .move-up           { animation-name: upRise; }
  .move-up-spread    { animation-name: upSpread; }
  .move-down-settle  { animation-name: downSettle; }
  @keyframes downFlow {
    0%   { opacity: 0; transform: translate(-50%, -50%) scale(0.6); }
    25%  { opacity: 1; transform: translate(-50%, -50%) scale(1); }
    100% { opacity: 0; transform: translate(-50%, 80%) scale(0.95); }
  }
  @keyframes upRise {
    0%   { opacity: 0; transform: translate(-50%, -50%) scale(0.6); }
    25%  { opacity: 1; transform: translate(-50%, -50%) scale(1); }
    100% { opacity: 0; transform: translate(-50%, -160%) scale(0.9); }
  }
  @keyframes upSpread {
    0%   { opacity: 0; transform: translate(-50%, -50%) scale(0.6); }
    25%  { opacity: 1; transform: translate(-50%, -50%) scale(1); }
    100% { opacity: 0; transform: translate(-32%, -170%) scale(1.22); filter: blur(2px); }
  }
  @keyframes downSettle {
    0%   { opacity: 0; transform: translate(-50%, -50%) scale(0.6); }
    25%  { opacity: 1; transform: translate(-50%, -50%) scale(1); }
    78%  { opacity: 1; transform: translate(-50%, 60%) scale(1); }
    100% { opacity: 0; transform: translate(-50%, 60%) scale(1); }
  }

  /* control (right) */
  .selected-box {
    background: var(--surface-soft);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 14px 16px;
    min-height: 52px;
    font-weight: 700;
    color: var(--ink);
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 6px;
    font-size: 14px;
    letter-spacing: -0.01em;
  }
  .selected-box .placeholder { color: var(--muted); font-weight: 500; }
  .selected-chip {
    padding: 4px 10px;
    border-radius: 99px;
    background: var(--surface-dark);
    color: #fff;
    font-size: 12px;
    font-weight: 700;
  }
  .selected-plus {
    color: var(--muted);
    font-weight: 700;
  }

  .tool-stack {
    display: grid;
    gap: 8px;
    margin-top: 14px;
  }
  .tool-btn {
    min-height: 46px;
    padding: 0 18px;
    border-radius: 12px;
    font-weight: 700;
    font-size: 14px;
    background: var(--surface-soft);
    color: var(--ink);
    border: 1px solid var(--border);
    transition: background 0.15s ease, border-color 0.15s ease, transform 0.15s ease;
  }
  .tool-btn:hover {
    background: #fff;
    border-color: var(--border-strong);
  }
  .tool-btn-primary {
    background: var(--surface-dark);
    color: #fff;
    border-color: var(--surface-dark);
  }
  .tool-btn-primary:hover {
    background: #000;
    border-color: #000;
    transform: translateY(-1px);
  }

  .log-box {
    margin-top: 16px;
    padding: 14px 16px;
    background: var(--surface-soft);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    font-size: 13px;
    color: var(--ink-soft);
    line-height: 1.6;
  }
  .log-box strong {
    display: block;
    font-size: 11px;
    color: var(--muted);
    letter-spacing: 0.08em;
    text-transform: uppercase;
    font-weight: 700;
    margin-bottom: 6px;
  }
  .log-empty { color: var(--muted); }

  /* modal */
  .modal-backdrop {
    position: fixed;
    inset: 0;
    background: rgba(10, 10, 10, 0.55);
    backdrop-filter: blur(4px);
    display: none;
    place-items: center;
    z-index: 50;
    padding: 16px;
  }
  .modal-backdrop.visible { display: grid; }
  .modal {
    width: min(560px, 100%);
    padding: 32px;
    border-radius: var(--radius-lg);
    background: var(--surface);
    border: 1px solid var(--border);
    text-align: center;
    box-shadow: var(--shadow-lg);
  }
  .modal-tag {
    display: inline-block;
    padding: 5px 12px;
    border-radius: 99px;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    margin-bottom: 10px;
  }
  .modal-tag.success {
    background: #f0fdf4; color: var(--success);
  }
  .modal-tag.fail {
    background: #fef2f2; color: var(--danger);
  }
  .modal h2 {
    margin: 0 0 8px;
    font-size: 28px;
    font-weight: 800;
    letter-spacing: -0.025em;
  }
  .modal-reason {
    margin: 0 0 18px;
    color: var(--ink-soft);
    font-size: 14px;
  }
  .result-cards {
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 10px;
    margin: 16px 0 20px;
  }
  .result-card {
    min-width: 100px;
    padding: 14px 16px;
    border-radius: var(--radius);
    color: #fff;
    box-shadow: var(--shadow);
  }
  .result-card strong {
    display: block;
    font-size: 22px;
    font-weight: 900;
    letter-spacing: -0.02em;
  }
  .result-card span {
    font-size: 12px;
    font-weight: 600;
    opacity: 0.92;
  }
  .equation-list {
    color: var(--ink-soft);
    line-height: 1.6;
    margin: 14px 0 18px;
    font-size: 13px;
  }
  .equation-list strong {
    display: block;
    font-size: 11px;
    color: var(--muted);
    letter-spacing: 0.08em;
    text-transform: uppercase;
    font-weight: 700;
    margin-bottom: 6px;
  }
  .modal-actions {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    justify-content: center;
  }
  .modal-actions .tool-btn {
    flex: 1;
    min-width: 130px;
  }

  /* responsive */
  @media (max-width: 1080px) {
    .layout { grid-template-columns: 1fr; }
    .board-panel { min-height: 380px; }
    .board { grid-template-columns: repeat(6, minmax(0, 1fr)); }
  }
  @media (max-width: 620px) {
    .status-bar { grid-template-columns: 1fr; }
    .board { grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 6px; }
    .tile .name { display: none; }
    .tile::before, .tile::after { top: 32%; }
    .tile .symbol { margin-top: 8px; }
  }

  .loader{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;z-index:100;transition:opacity .6s ease,visibility .6s ease}
  .loader.hidden{opacity:0;visibility:hidden;pointer-events:none}.loader-mark{width:64px;height:64px;border-radius:18px;background:var(--surface-dark);color:#fff;display:grid;place-items:center;font-size:30px;box-shadow:var(--shadow-lg);animation:labFloat 1.2s ease-in-out infinite}.loader-bar{width:220px;height:4px;background:var(--border);border-radius:99px;overflow:hidden}.loader-fill{height:100%;width:0;background:var(--surface-dark);border-radius:inherit;animation:labLoad 1.45s ease forwards}.loader-label{font-size:13px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase;font-weight:700}@keyframes labFloat{50%{transform:translateY(-6px)}}@keyframes labLoad{to{width:100%}}

  /* Restored toy-like board motion */
  .tile{
    border-radius:20px;
    cursor:pointer;
    position:relative;
    box-shadow:0 10px 22px rgba(15,23,42,.14),inset 0 1px 0 rgba(255,255,255,.45),inset 0 -10px 16px rgba(0,0,0,.16);
    transition:transform 220ms cubic-bezier(.22,1,.36,1),box-shadow 220ms ease,opacity 260ms ease,filter 260ms ease,border-color 220ms ease;
    will-change:transform,opacity,filter;
  }
  .tile:hover:not(.consumed){
    transform:translateY(-6px) scale(1.025);
    box-shadow:0 18px 34px rgba(15,23,42,.20),inset 0 1px 0 rgba(255,255,255,.55),inset 0 -10px 16px rgba(0,0,0,.16);
  }

    transform:translateY(-8px) scale(1.04);

    border-color:rgba(59,167,207,.8);
    box-shadow:0 0 0 3px rgba(59,167,207,.28),0 20px 38px rgba(15,23,42,.22),inset 0 1px 0 rgba(255,255,255,.55),inset 0 -10px 16px rgba(0,0,0,.16);
  }
  .tile.consumed{
    opacity:.32;

function shuffleArray(array){const result=[...array];for(let i=result.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[result[i],result[j]]=[result[j],result[i]]}return result}

function requiredAtoms(){const counts=new Map();PART.reactions.forEach(r=>(r.input||[]).forEach(symbol=>counts.set(symbol,(counts.get(symbol)||0)+1)));return [...counts].map(([symbol,count])=>({symbol,count}))}

function renderBoard(){if(!state.board)state.board=createRandomBoard(requiredAtoms(),PART.board||PART.stock,Math.max(24,(PART.stock||PART.board||[]).length));$("#board").innerHTML=state.board.map((tile,i)=>'<button class="tile tile-in '+classOf(tile.symbol)+(tile.consumed?' consumed':'')+'" style="--i:'+i+'" data-id="'+tile.id+'" data-key="'+tile.symbol+'" type="button" '+(tile.consumed?'disabled':'')+'><span class="symbol'+(label(tile.symbol).length>6?' sym-xlong':label(tile.symbol).length>4?' sym-long':'')+'">'+label(tile.symbol)+'</span><span class="name">'+nameOf(tile.symbol)+'</span></button>').join("");$$(".tile").forEach(t=>{t.onclick=()=>toggle(t);t.addEventListener("animationend",e=>{if(e.animationName==="tileIn")t.classList.remove("tile-in")})})}

function combine(){if(!state.active||state.ending)return;if(!state.selected.length){setMessage("먼저 카드를 선택해 보세요.","neutral");return}const symbols=state.selected.map(id=>tileById(id)).filter(Boolean).map(tile=>tile.symbol);const r=PART.reactions.find(x=>sort(x.input)===sort(symbols));if(!r){state.wrong++;shakeSelected();const kinds=a=>[...new Set(a)].sort().join(","),near=PART.reactions.find(x=>!state.madeIds.has(x.id)&&kinds(x.input)===kinds(symbols));setMessage(near?"△ 재료 종류는 맞았어요! 반응 전과 후의 원자 수가 같아지도록 카드 개수를 맞춰 보세요.":"× 조합이 살짝 달라요. 힌트를 보고 다시 맞춰볼까요?","error");setTimeout(()=>clearSel(false),320);updateHud();return}if(state.madeIds.has(r.id)){setMessage("이미 완성한 반응이에요. 다른 조합도 찾아보세요.","error");clearSel(false);return}success(r)}
function success(r){const usedIds=[...state.selected];const from=usedIds.map(id=>$('.tile[data-id="'+id+'"]')).filter(Boolean).map(el=>({el,rect:el.getBoundingClientRect()}));state.made.push(r);state.madeIds.add(r.id);usedIds.forEach(id=>{const tile=tileById(id);if(tile)tile.consumed=true;const el=$('.tile[data-id="'+id+'"]');if(el){el.classList.remove("selected");el.classList.add("consumed");el.disabled=true}});record(r);animate(r,from);state.selected=[];renderSelected();updateHud();$("#statusBar").classList.add("challenge-burst");setTimeout(()=>$("#statusBar").classList.remove("challenge-burst"),600);const chip=$("#goalLabel").closest(".status-chip");if(chip&&chip.animate&&!reduceMotion())chip.animate([{transform:"scale(1)"},{transform:"scale(1.14)"},{transform:"scale(1)"}],{duration:460,easing:"cubic-bezier(.34,1.56,.64,1)"});let msg=state.mode==="challenge"?(state.made.length===1?"1개 완성! 계속 가볼까요?":state.made.length===2?"2개 완성! 거의 다 왔어요.":"성공! 제한 시간 안에 완성했어요."):"✓ 좋아요! "+r.desc;setMessage(msg,"success");$("#reactionBox").innerHTML="<strong>조합 정보</strong>"+equationHtml(r);if(state.made.length>=state.goal){state.ending=true;clearInterval(state.timer);setTimeout(()=>finish(true,state.mode==="challenge"?"성공! 제한 시간 안에 완성했어요.":r.desc),reduceMotion()?700:2100)}}
function animate(r,from){const layer=$("#animationLayer"),box=layer.getBoundingClientRect(),cx=box.width/2,cy=box.height/2,rm=reduceMotion()||!layer.animate;let wait=0;if(!rm){from.forEach(({el,rect},i)=>{const g=el.cloneNode(true);g.classList.remove("selected","consumed","shake","tile-in");g.classList.add("ghost-tile");g.removeAttribute("disabled");const x=rect.left-box.left,y=rect.top-box.top;g.style.left=x+"px";g.style.top=y+"px";g.style.width=rect.width+"px";g.style.height=rect.height+"px";layer.appendChild(g);const dx=cx-(x+rect.width/2),dy=cy-(y+rect.height/2),tilt=(i%2?1:-1)*10;g.animate([{transform:"translate(0,-8px) scale(1.04)",opacity:1},{transform:"translate("+dx*.45+"px,"+(dy*.45-36)+"px) scale(.94) rotate("+tilt+"deg)",opacity:1,offset:.5},{transform:"translate("+dx+"px,"+dy+"px) scale(.3) rotate("+tilt*2+"deg)",opacity:.15}],{duration:560,delay:i*60,easing:"cubic-bezier(.55,0,.55,1)",fill:"forwards"}).onfinish=()=>g.remove();setTimeout(()=>g.remove(),760+i*60)});wait=520+(from.length-1)*60}setTimeout(()=>{if(!rm)reactionBurst(layer,cx,cy,r);showProducts(r,layer,rm)},wait)}
function reactionBurst(layer,cx,cy,r){const ring=document.createElement("div");ring.className="react-ring";ring.style.left=cx+"px";ring.style.top=cy+"px";layer.appendChild(ring);ring.animate([{transform:"translate(-50%,-50%) scale(.15)",opacity:.9},{transform:"translate(-50%,-50%) scale(2.6)",opacity:0}],{duration:620,easing:"cubic-bezier(.22,1,.36,1)",fill:"forwards"}).onfinish=()=>ring.remove();setTimeout(()=>ring.remove(),800);const n=12;for(let i=0;i<n;i++){const s=document.createElement("div"),a=i/n*Math.PI*2+Math.random()*.4,d=70+Math.random()*60;s.className="react-spark";s.style.left=cx+"px";s.style.top=cy+"px";s.style.background=cardBg(r.products[i%r.products.length]);layer.appendChild(s);s.animate([{transform:"translate(-50%,-50%) scale(1)",opacity:1},{transform:"translate(calc(-50% + "+Math.cos(a)*d+"px),calc(-50% + "+Math.sin(a)*d+"px)) scale(.2)",opacity:0}],{duration:560+Math.random()*200,easing:"cubic-bezier(.22,1,.36,1)",fill:"forwards"}).onfinish=()=>s.remove();setTimeout(()=>s.remove(),900)}}
